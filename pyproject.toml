[project]
name = "sheet-to-pipeline"
version = "0.1.0"
description = "A small business's monthly Excel report rebuilt as a tested dbt pipeline, with a reconciliation that proves it."
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
    "duckdb>=1.4",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pydantic>=2.9",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
s2p = "sheet_to_pipeline.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
    "types-openpyxl>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheet_to_pipeline"]
